name: Feature request
description: Propose a focused improvement to CZSH.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any relevant alternatives.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Compatibility and scope
      description: Note affected platforms, tools, configuration files, or migration concerns.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked existing issues and pull requests for similar proposals.
          required: true
