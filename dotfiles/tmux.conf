# ──────────────────────────────────────────────
#  czsh tmux configuration
# ──────────────────────────────────────────────

# ─── Prefix ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ─────────────────────────────────
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set  -g history-limit 50000
set  -g escape-time 0
set  -g focus-events on
set  -g mouse on
set  -g set-clipboard on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g display-time 3000
set  -g display-panes-time 3000

# Name windows after the active pane's directory instead of its foreground
# process. This keeps several editor or shell windows easy to distinguish.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ─── Reload config ───────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ─── Help ─────────────────────────────────────
bind e display-popup -w 70 -h 40 -T " tmux-help " "zsh -ic 'tmux-help | less -R'"

# ─── Window splitting ───────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (vim-style) ────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing ──────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ─────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# Move windows
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# ─── Copy mode (vi) ─────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Clipboard integration — platform-aware
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# ─── Status bar (Tokyo Night) ───────────────
# Every value below is expanded by tmux itself. There are no shell commands in
# the refresh path, keeping the status line effectively free to update.
set  -g status on
set  -g status-interval 10
set  -g status-position bottom
set  -g status-justify left
set  -g status-style "fg=#a9b1d6,bg=#1a1b26"

# Left: show a warning only while Ctrl+A is waiting for a command.
set  -g status-left-length 12
set  -g status-left "#{?client_prefix,#[fg=#1a1b26#,bg=#e0af68#,bold] PREFIX #[fg=#e0af68#,bg=#1a1b26] ,}"

# Right: full Git state and clock. The helper reports branch, upstream
# divergence, and worktree state. #() is asynchronous, so tmux never waits.
set  -g status-right-length 100
set  -g status-right "#(~/.config/czsh/bin/czsh-tmux-git-status #{q:pane_current_path}) #[fg=#565f89]#{?pane_synchronized,│ 󰓦 sync ,}│ #[fg=#a9b1d6]%a %d %b #[fg=#565f89]│ #[fg=#7aa2f7,bold]%H:%M "

# Window tabs
setw -g window-status-format         "#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_flags, #[fg=#565f89]#F,} "
setw -g window-status-current-format "#[fg=#bb9af7,bold] 󰄬 #I:#W #[fg=#565f89]#F "
setw -g window-status-separator      ""

# Pane borders
set  -g pane-border-style        "fg=#3b4261"
set  -g pane-active-border-style "fg=#7aa2f7"

# Messages
set  -g message-style "fg=#1a1b26,bg=#7aa2f7,bold"
set  -g message-command-style "fg=#1a1b26,bg=#bb9af7,bold"

# ─── Plugins (TPM) ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Bootstrap TPM (ignore if not yet installed)
if-shell "test -d ~/.config/czsh/tmux/plugins/tpm" {
    run '~/.config/czsh/tmux/plugins/tpm/tpm'
}
