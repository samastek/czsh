# ──────────────────────────────────────────────
#  czsh tmux configuration
# ──────────────────────────────────────────────

# ─── Prefix ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ─────────────────────────────────
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set  -g history-limit 50000
set  -g escape-time 0
set  -g focus-events on
set  -g mouse on
set  -g set-clipboard on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g display-time 3000
set  -g display-panes-time 3000
set  -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY XAUTHORITY"

# Name windows after the active pane's directory instead of its foreground
# process. This keeps several editor or shell windows easy to distinguish.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ─── Reload config ───────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ─── Help ─────────────────────────────────────
bind e display-popup -w 70 -h 40 -T " tmux-help " "zsh -ic 'tmux-help | less -R'"

# ─── Workflow popups ─────────────────────────
bind f display-popup -E -w 80% -h 70% -T " projects " "~/.config/czsh/bin/czsh-sessionizer"
bind -n C-f display-popup -E -w 80% -h 70% -T " projects " "~/.config/czsh/bin/czsh-sessionizer"
bind g display-popup -E -d "#{pane_current_path}" -w 95% -h 95% -T " lazygit " "lazygit"
bind D display-popup -E -d "#{pane_current_path}" -w 95% -h 95% -T " lazydocker " "lazydocker"
bind / display-popup -E -w 85% -h 75% -T " windows & panes " "~/.config/czsh/bin/czsh-tmux-search"

# ─── Window splitting ───────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (vim-style) ────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing ──────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ─────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# Move windows
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# ─── Copy mode (vi) ─────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Clipboard integration — platform-aware
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

# ─── Status bar ──────────────────────────────
# Colors and application themes are generated from runtime/10-theme.zsh.
set  -g status on
set  -g status-interval 5
set  -g status-position bottom
set  -g status-justify left
set  -g status-left-length 12
set  -g status-right-length 100
setw -g window-status-separator      " "
source-file -q ~/.config/czsh/tmux/theme.conf

# ─── Plugins (TPM) ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# Bootstrap TPM (ignore if not yet installed)
if-shell "test -d ~/.config/czsh/tmux/plugins/tpm" {
    run '~/.config/czsh/tmux/plugins/tpm/tpm'
}
