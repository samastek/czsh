# ──────────────────────────────────────────────
#  czsh tmux configuration
# ──────────────────────────────────────────────

# ─── Prefix ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ─────────────────────────────────
set  -g default-terminal "tmux-256color"
set  -g terminal-overrides "linux*:AX@,xterm-256color:RGB"
set  -g history-limit 50000
set  -g escape-time 0
set  -g focus-events on
set  -g mouse on
set  -g set-clipboard on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g detach-on-destroy next
set  -g display-time 3000
set  -g display-panes-time 3000
set  -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY XAUTHORITY"

# Name windows after the active pane's directory instead of its foreground
# process. This keeps several editor or shell windows easy to distinguish.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ─── Reload config ───────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ─── Help ─────────────────────────────────────
bind e display-popup -w 70 -h 40 -T " tmux-help " "zsh -ic 'tmux-help | less -R'"

# ─── Workflow popups ─────────────────────────
bind f display-popup -E -w 80% -h 70% -T " sessions & projects " "~/.config/czsh/bin/czsh-sessionizer"
bind -n C-f display-popup -E -w 80% -h 70% -T " sessions & projects " "~/.config/czsh/bin/czsh-sessionizer"
bind g display-popup -E -d "#{pane_current_path}" -w 95% -h 95% -T " lazygit " "lazygit"
bind D display-popup -E -d "#{pane_current_path}" -w 95% -h 95% -T " lazydocker " "lazydocker"
bind / display-popup -E -w 85% -h 75% -T " windows & panes " "~/.config/czsh/bin/czsh-tmux-search"

# ─── Window splitting ───────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Closing a window/pane only HUPs the shell; also TERM everything else in each
# pane's session (nohup'd and no_hup jobs). setsid daemons still escape.
bind & confirm-before -p "kill-window #W? (y/n)" { run-shell 'for p in #{P:#{pane_pid} }; do pkill -TERM -s $p; done'; kill-window }
bind x confirm-before -p "kill-pane #P? (y/n)" { run-shell 'pkill -TERM -s #{pane_pid}'; kill-pane }

# ─── Pane navigation (vim-style) ────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing ──────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ─────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# Move windows
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# ─── Status bar ──────────────────────────────
# Colors and application themes are generated from runtime/10-theme.zsh.
set  -g status on
set  -g status-interval 5
set  -g status-position bottom
set  -g status-justify left
set  -g status-left-length 12
set  -g status-right-length 120
setw -g window-status-separator      " "
source-file -q ~/.config/czsh/tmux/theme.conf

# ─── Plugins (TPM) ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# Bootstrap TPM (ignore if not yet installed)
if-shell "test -d ~/.config/czsh/tmux/plugins/tpm" {
    run '~/.config/czsh/tmux/plugins/tpm/tpm'
}

# ─── Copy mode and mouse ────────────────────
# Wheel scrolls tmux history; drag, double- and triple-click copy without
# leaving copy mode, so the view stays where you were reading. Shift+drag
# (Option+drag in iTerm2) bypasses tmux for native terminal selection.
setw -g mode-keys vi
# Explicit binds so a live server reloaded from an older config gets them back.
bind [     copy-mode
bind PPage copy-mode -u
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear

# set-clipboard sends copies through OSC 52; copy-command covers terminals
# without it (GNOME Terminal) and needs pbcopy, wl-copy or xclip.
set -g copy-command 'if command -v pbcopy >/dev/null; then pbcopy; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null; then wl-copy; elif command -v xclip >/dev/null; then xclip -in -selection clipboard; else cat >/dev/null; fi'

# Clear bindings and settings left by tmux-yank when reloading a live server.
unbind -q y
unbind -q Y
set -gu @yank_action
